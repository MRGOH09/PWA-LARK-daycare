<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>点名统计 Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #34d399;
    --warn: #f59e0b;
    --bad: #fb7185;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: end;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
  a, button, select {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 12px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07111f; }
  main { display: grid; gap: 14px; padding: 16px 20px 28px; }
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tabs button[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #07111f;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  input, select {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
  }
  .range-toggle {
    display: inline-grid;
    grid-auto-flow: column;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
  }
  .range-toggle button {
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
  }
  .range-toggle button.active {
    background: var(--accent);
    color: #07111f;
  }
  .meta { color: var(--muted); font-size: 12px; }
  .analysis-grid {
    display: grid;
    grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.5fr);
    gap: 14px;
    align-items: start;
  }
  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 {
    margin: 0;
    font-size: 15px;
  }
  .panel-head p { margin: 3px 0 0; }
  .calendar {
    display: grid;
    gap: 1px;
    padding: 10px;
    background: var(--border);
  }
  .calendar-head,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(38px, 1fr));
    gap: 1px;
  }
  .calendar-head div {
    padding: 8px 4px;
    background: var(--panel-2);
    color: var(--muted);
    text-align: center;
    font-size: 12px;
    font-weight: 800;
  }
  .calendar-day {
    min-height: 86px;
    border: 0;
    border-radius: 0;
    background: #182236;
    color: var(--text);
    padding: 8px;
    text-align: left;
    font-weight: 700;
  }
  .calendar-day.empty {
    min-height: 86px;
    border: 0;
    background: #111827;
    opacity: 0.55;
    padding: 0;
  }
  .calendar-day.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .calendar-day.good { background: rgba(52, 211, 153, 0.20); }
  .calendar-day.warn { background: rgba(245, 158, 11, 0.22); }
  .calendar-day.bad { background: rgba(239, 68, 68, 0.24); }
  .calendar-day.no-data { color: var(--muted); }
  .calendar-day strong {
    display: block;
    font-size: 15px;
  }
  .calendar-day span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }
  .matrix-wrap {
    overflow: auto;
    padding: 10px;
  }
  .matrix {
    width: 100%;
    min-width: 620px;
    border-collapse: separate;
    border-spacing: 1px;
    background: var(--border);
    font-size: 12px;
  }
  .matrix th,
  .matrix td {
    border: 0;
    background: var(--panel-2);
    padding: 8px;
    white-space: normal;
    vertical-align: top;
  }
  .matrix th {
    position: static;
    color: var(--muted);
  }
  .matrix button {
    width: 100%;
    min-height: 72px;
    border: 0;
    border-radius: 6px;
    background: #182236;
    text-align: left;
    font-weight: 800;
  }
  .matrix button.good { background: rgba(52, 211, 153, 0.18); }
  .matrix button.warn { background: rgba(245, 158, 11, 0.20); }
  .matrix button.bad { background: rgba(239, 68, 68, 0.22); }
  .matrix button span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
  }
  .scope-note {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 10px 12px;
    color: var(--muted);
    font-size: 12px;
  }
  .scope-note strong { color: var(--text); }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
  }
  .card span { color: var(--muted); font-size: 12px; }
  .card strong {
    display: block;
    margin-top: 4px;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
  }
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  th {
    position: sticky;
    top: 0;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
  }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .name strong { display: block; }
  .name span { color: var(--muted); font-size: 12px; }
  .student-row { cursor: pointer; }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 800;
    background: var(--panel-2);
    color: var(--text);
  }
  .pill.complete { color: #052e1d; background: var(--good); }
  .pill.partial { color: #3b2400; background: var(--warn); }
  .pill.not-started { color: #e2e8f0; background: #64748b; }
  .pill.absent { color: #fff1f2; background: var(--danger); }
  .progress {
    width: 96px;
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #0b1220;
  }
  .progress span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
  }
  .step-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }
  .step-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
  }
  .step-card strong { display: block; margin-bottom: 6px; }
  .step-card .bar {
    height: 7px;
    border-radius: 999px;
    background: #0b1220;
    overflow: hidden;
    margin: 8px 0;
  }
  .step-card .bar span {
    display: block;
    height: 100%;
    background: var(--good);
  }
  .step-card p { margin: 0; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(15, 23, 42, 0.78);
  }
  .modal[hidden] { display: none; }
  .modal-panel {
    width: min(720px, 100%);
    max-height: 86vh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  .modal-head {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: start;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .modal-body {
    display: grid;
    gap: 14px;
    padding: 16px;
  }
  .detail-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }
  .detail-list div {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    padding: 10px;
  }
  .detail-list span { display: block; color: var(--muted); font-size: 12px; }
  .steps-detail {
    display: grid;
    gap: 8px;
  }
  .step-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
  }
  .empty {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    padding: 18px;
    text-align: center;
  }
  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: rgba(15, 23, 42, 0.94);
    padding: 22px;
  }
  .auth-gate[hidden] { display: none; }
  .auth-panel {
    width: min(420px, 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 22px;
    text-align: center;
  }
  .google-signin-button { display: flex; justify-content: center; min-height: 44px; margin-top: 16px; }
  @media (max-width: 1100px) {
    .analysis-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    header { display: grid; }
    .toolbar input, .toolbar button, .toolbar a, .toolbar select { width: 100%; }
    main { padding-inline: 12px; }
    table { min-width: 760px; }
    .calendar-day { min-height: 74px; padding: 6px; }
    .calendar-day span { font-size: 10px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>点名统计 Dashboard</h1>
    <p>按每天或每月查看每位老师的点名操作与功课完成记录</p>
  </div>
  <div class="header-actions">
    <button id="quick-refresh" class="primary" type="button">一键更新</button>
    <a href="/attendance.html">回到点名</a>
  </div>
</header>

<section class="auth-gate" id="auth-gate" hidden>
  <div class="auth-panel">
    <h2>Google 登录</h2>
    <p>统计 dashboard 只开放给 Lark 白名单内的老师账号。</p>
    <div id="google-signin-button" class="google-signin-button"></div>
    <p id="auth-status">正在检查登录状态…</p>
  </div>
</section>

<main>
  <nav class="tabs" aria-label="Dashboard 视图">
    <button id="tab-students" type="button" data-view="students" aria-selected="true">学生点名状况</button>
    <button id="tab-teachers" type="button" data-view="teachers" aria-selected="false">老师操作统计</button>
  </nav>
  <div class="toolbar">
    <div class="range-toggle" aria-label="统计范围">
      <button class="active" id="range-day" type="button" data-range="day">每天</button>
      <button id="range-month" type="button" data-range="month">每月</button>
    </div>
    <input id="date" type="date" aria-label="统计日期" />
    <input id="month" type="month" aria-label="统计月份" />
    <button id="refresh" class="primary" type="button">刷新</button>
    <button id="sign-out" type="button" hidden>登出</button>
    <span id="meta" class="meta">尚未加载</span>
  </div>
  <div class="toolbar" id="student-filters">
    <input id="student-search" type="search" placeholder="搜索学生/老师/编号" aria-label="搜索学生、老师或编号" />
    <select id="filter-campus" aria-label="筛选分院"></select>
    <select id="filter-year" aria-label="筛选年级"></select>
    <select id="filter-block" aria-label="筛选 BLOCK"></select>
    <select id="filter-teacher" aria-label="筛选负责老师"></select>
    <select id="filter-status" aria-label="筛选点名状态"></select>
  </div>
  <section class="summary" id="summary"></section>
  <section class="scope-note" id="scope-note" hidden></section>
  <section class="analysis-grid" id="student-analysis" hidden>
    <article class="panel">
      <div class="panel-head">
        <div>
          <h2>月历总览</h2>
          <p>点击日期查看当天细节</p>
        </div>
      </div>
      <div id="calendar" class="calendar"></div>
    </article>
    <article class="panel">
      <div class="panel-head">
        <div>
          <h2>Block × 时间段</h2>
          <p>点击格子只看该部分学生</p>
        </div>
        <button id="clear-matrix-filter" type="button" hidden>清除</button>
      </div>
      <div id="matrix" class="matrix-wrap"></div>
    </article>
  </section>
  <section class="step-grid" id="steps"></section>
  <section id="content" class="empty">加载统计中…</section>
</main>

<section class="modal" id="student-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="student-modal-title">
    <div class="modal-head">
      <div>
        <h2 id="student-modal-title">学生点名细节</h2>
        <p id="student-modal-meta"></p>
      </div>
      <button id="student-modal-close" type="button">关闭</button>
    </div>
    <div class="modal-body" id="student-modal-body"></div>
  </div>
</section>

<script src="js/attendance-dashboard.js?v=11" defer></script>
</body>
</html>
