<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" />
<title>班级状态 Class Check-in</title>
<style>
  :root {
    --bg: #f8fbff;
    --panel: #ffffff;
    --panel-2: #eef6ff;
    --ink: #102033;
    --muted: #64748b;
    --line: #d9e7f5;
    --blue: #0ea5e9;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --purple: #8b5cf6;
    --gray: #94a3b8;
    --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.14), transparent 28%),
      radial-gradient(circle at 82% 20%, rgba(245, 158, 11, 0.13), transparent 24%),
      linear-gradient(135deg, #f8fbff 0%, #eef8f8 54%, #fff7ed 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    overflow: hidden;
  }

  button,
  select,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px;
  }

  .center-screen {
    display: grid;
    place-items: center;
  }

  .login-panel,
  .setup-panel {
    width: min(760px, calc(100vw - 40px));
    border: 1px solid rgba(217, 231, 245, 0.9);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: var(--shadow);
    padding: 34px;
  }

  .brand-kicker {
    color: var(--blue);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }

  h1 {
    margin: 8px 0 8px;
    font-size: clamp(38px, 5vw, 68px);
    line-height: 1.02;
    letter-spacing: 0;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: clamp(18px, 2vw, 26px);
    line-height: 1.35;
  }

  .form-grid {
    display: grid;
    gap: 18px;
    margin-top: 28px;
  }

  label {
    display: grid;
    gap: 8px;
    color: var(--muted);
    font-size: 16px;
    font-weight: 900;
  }

  input,
  select {
    width: 100%;
    min-height: 58px;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: #ffffff;
    color: var(--ink);
    padding: 0 18px;
    font-size: 22px;
    font-weight: 900;
  }

  input:focus,
  select:focus {
    border-color: var(--blue);
    outline: 5px solid rgba(14, 165, 233, 0.16);
  }

  .primary-button,
  .ghost-button {
    min-height: 58px;
    border: 0;
    border-radius: 16px;
    padding: 0 22px;
    font-size: 21px;
    font-weight: 1000;
  }

  .primary-button {
    background: #0f172a;
    color: #ffffff;
  }

  .ghost-button {
    border: 2px solid var(--line);
    background: rgba(255, 255, 255, 0.76);
    color: var(--ink);
  }

  .message {
    min-height: 24px;
    margin-top: 14px;
    color: var(--red);
    font-size: 17px;
    font-weight: 900;
  }

  .board-screen {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    gap: 18px;
  }

  .board-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: start;
  }

  .board-title h1 {
    margin: 0;
    font-size: clamp(36px, 4.8vw, 74px);
  }

  .board-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
  }

  .meta-pill {
    border: 1px solid rgba(14, 165, 233, 0.24);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.76);
    color: #075985;
    padding: 9px 14px;
    font-size: clamp(15px, 1.35vw, 21px);
    font-weight: 1000;
  }

  .board-actions {
    display: flex;
    gap: 10px;
  }

  .board-actions button {
    min-height: 48px;
    border-radius: 14px;
    font-size: 17px;
  }

  .teacher-strip {
    display: grid;
    gap: 8px;
    border: 1px solid rgba(217, 231, 245, 0.9);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.78);
    padding: 16px 18px;
  }

  .teacher-strip span {
    color: var(--muted);
    font-size: 15px;
    font-weight: 900;
  }

  .teacher-strip strong {
    font-size: clamp(19px, 1.8vw, 30px);
    line-height: 1.2;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
  }

  .stat-card {
    min-height: 112px;
    border: 1px solid rgba(217, 231, 245, 0.9);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.84);
    box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
    padding: 14px 16px;
  }

  .stat-card .label {
    color: var(--muted);
    font-size: clamp(14px, 1.25vw, 19px);
    font-weight: 1000;
  }

  .stat-card .value {
    margin-top: 8px;
    font-size: clamp(34px, 4vw, 66px);
    line-height: 0.95;
    font-weight: 1000;
    font-variant-numeric: tabular-nums;
  }

  .stat-total .value { color: var(--blue); }
  .stat-arrived .value { color: var(--green); }
  .stat-waiting .value { color: var(--amber); }
  .stat-absent .value { color: var(--red); }
  .stat-koko .value { color: var(--purple); }
  .stat-idle .value { color: var(--gray); }

  .student-stage {
    min-height: 0;
    border: 1px solid rgba(217, 231, 245, 0.86);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.74);
    box-shadow: var(--shadow);
    padding: 18px;
    overflow: hidden;
  }

  .page-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 14px;
    align-content: start;
    height: 100%;
  }

  .group-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    min-height: 48px;
    border-radius: 16px;
    padding: 8px 14px;
    color: #ffffff;
    font-weight: 1000;
  }

  .group-header strong {
    font-size: clamp(21px, 2vw, 34px);
  }

  .group-header span {
    font-size: clamp(14px, 1.4vw, 20px);
  }

  .group-arrived { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .group-waiting { background: linear-gradient(90deg, #d97706, #f59e0b); }
  .group-absent { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .group-koko { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  .group-idle { background: linear-gradient(90deg, #64748b, #94a3b8); }

  .student-card {
    display: grid;
    gap: 12px;
    min-height: 148px;
    border: 2px solid var(--line);
    border-radius: 20px;
    background: #ffffff;
    padding: 15px;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
  }

  .student-card.arrived { border-color: rgba(34, 197, 94, 0.45); }
  .student-card.waiting { border-color: rgba(245, 158, 11, 0.48); }
  .student-card.absent { border-color: rgba(239, 68, 68, 0.48); }
  .student-card.koko { border-color: rgba(139, 92, 246, 0.48); }
  .student-card.idle { border-color: rgba(148, 163, 184, 0.56); }

  .student-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .student-name {
    min-width: 0;
    font-size: clamp(26px, 2.5vw, 42px);
    line-height: 1.05;
    font-weight: 1000;
    overflow-wrap: anywhere;
  }

  .points {
    flex: 0 0 auto;
    border-radius: 999px;
    background: #fff7ed;
    color: #b45309;
    padding: 7px 11px;
    font-size: clamp(16px, 1.35vw, 22px);
    font-weight: 1000;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: clamp(15px, 1.3vw, 20px);
    font-weight: 900;
  }

  .status-dot {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    background: var(--gray);
  }

  .student-card.arrived .status-dot { background: var(--green); }
  .student-card.waiting .status-dot { background: var(--amber); }
  .student-card.absent .status-dot { background: var(--red); }
  .student-card.koko .status-dot { background: var(--purple); }

  .flow-chips {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }

  .flow-chip {
    min-height: 36px;
    border-radius: 10px;
    background: #e2e8f0;
    color: #334155;
    display: grid;
    place-items: center;
    font-size: clamp(13px, 1vw, 17px);
    font-weight: 1000;
  }

  .flow-chip.good { background: #dcfce7; color: #047857; }
  .flow-chip.warn { background: #fef3c7; color: #b45309; }
  .flow-chip.bad { background: #fee2e2; color: #dc2626; }
  .flow-chip.koko { background: #ede9fe; color: #7c3aed; }
  .flow-chip.home { background: #d1fae5; color: #15803d; }
  .flow-chip.idle { background: #f1f5f9; color: #64748b; }

  .board-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #475569;
    font-size: clamp(14px, 1.2vw, 18px);
    font-weight: 900;
  }

  .page-dots {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .page-dot {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: #cbd5e1;
  }

  .page-dot.active {
    width: 34px;
    background: var(--blue);
  }

  .hidden { display: none !important; }

  .empty-state {
    display: grid;
    place-items: center;
    min-height: 100%;
    color: var(--muted);
    text-align: center;
    font-size: clamp(22px, 2.4vw, 36px);
    font-weight: 1000;
  }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .screen { padding: 18px; }
    .board-screen { min-height: 100vh; }
    .board-top { grid-template-columns: 1fr; }
    .board-actions { justify-content: stretch; }
    .board-actions button { flex: 1; }
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .student-stage { overflow: visible; }
    .page-grid { height: auto; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <section id="pin-screen" class="screen center-screen">
    <div class="login-panel">
      <div class="brand-kicker">DAYCARE TV</div>
      <h1>班级状态<br />Class Check-in</h1>
      <p class="subtitle">输入 PIN 后选择班级，让电视自动播放今天的点名状态。</p>
      <form id="pin-form" class="form-grid">
        <label>PIN
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="7373" />
        </label>
        <button class="primary-button" type="submit">进入</button>
      </form>
      <div id="pin-message" class="message"></div>
    </div>
  </section>

  <section id="setup-screen" class="screen center-screen hidden">
    <div class="setup-panel">
      <div class="brand-kicker">SETUP</div>
      <h1>选择班级</h1>
      <p class="subtitle">先选地方，再选 BLOCK 和时间段。</p>
      <form id="setup-form" class="form-grid">
        <label>地方 / 分院
          <select id="campus-select"></select>
        </label>
        <label id="block-field">BLOCK
          <select id="block-select"></select>
        </label>
        <label>时间段
          <select id="period-select"></select>
        </label>
        <button class="primary-button" type="submit">开始播放</button>
      </form>
      <div id="setup-message" class="message"></div>
    </div>
  </section>

  <main id="board-screen" class="screen board-screen hidden">
    <header class="board-top">
      <div class="board-title">
        <h1>班级状态 Class Check-in</h1>
        <div id="board-meta" class="board-meta"></div>
      </div>
      <div class="board-actions">
        <button id="change-class" class="ghost-button" type="button">更换班级</button>
        <button id="logout-pin" class="ghost-button" type="button">退出</button>
      </div>
    </header>

    <section class="teacher-strip">
      <span>负责老师</span>
      <strong id="teacher-list">-</strong>
    </section>

    <section id="stats-grid" class="stats-grid"></section>

    <section id="student-stage" class="student-stage">
      <div class="empty-state">加载中…</div>
    </section>

    <footer class="board-footer">
      <div id="refresh-label">最后更新：-</div>
      <div id="page-dots" class="page-dots"></div>
    </footer>
  </main>

  <script src="js/tv-attendance.js?v=tv-v1" defer></script>
</body>
</html>
