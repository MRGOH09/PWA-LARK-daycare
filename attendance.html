<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="DAYCARE 点名" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>DAYCARE 点名</title>
<link rel="manifest" href="attendance.webmanifest" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --panel-3: #111827;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #34d399;
    --bad: #f87171;
    --koko: #a78bfa;
    --home: #22c55e;
    --idle: #64748b;
    --status-warning: #f59e0b;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  html[data-display-mode="pwa"] body {
    padding-bottom: env(safe-area-inset-bottom);
  }

  header.top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: end;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  html[data-display-mode="pwa"] header.top {
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  header.top h1 { margin: 0; font-size: 22px; line-height: 1.2; }
  header.top p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
  .top-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }
  .top-actions a,
  .top-actions button {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }
  .top-actions button {
    background: var(--accent);
    border-color: var(--accent);
    color: #07111f;
  }
  .current-user {
    align-self: center;
    max-width: 220px;
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .top-actions button.secondary {
    background: var(--panel-2);
    border-color: var(--border);
    color: var(--text);
  }

  .auth-gate {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    padding: 22px;
    background: rgba(15, 23, 42, 0.94);
  }
  .auth-gate[hidden] { display: none; }
  .auth-panel {
    width: min(420px, 100%);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 22px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
  }
  .auth-panel h2 {
    margin: 0;
    font-size: 22px;
  }
  .auth-panel p {
    margin: 8px 0 18px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .google-signin-button {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }
  .auth-status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .view-tabs {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.96);
    backdrop-filter: blur(10px);
  }
  .view-tab {
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }
  .view-tab.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #07111f;
  }
  html[data-view="stats"] #attendance-summary,
  html[data-view="stats"] #attendance-main {
    display: none !important;
  }
  html[data-view="attendance"] #teacher-stats-panel {
    display: none !important;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 8px;
    padding: 12px 20px;
  }
  .summary .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .summary .card .label { color: var(--muted); font-size: 11px; }
  .summary .card .value {
    margin-top: 2px;
    font-size: 22px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .summary .card.normal .value { color: var(--good); }
  .summary .card.warning .value { color: var(--status-warning); }

  .teacher-stats-panel {
    display: grid;
    gap: 10px;
    padding: 0 20px 12px;
  }
  .teacher-stats-panel[hidden] { display: none; }
  .teacher-stats-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }
  .teacher-stats-head {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .teacher-stats-head h2 {
    margin: 0;
    font-size: 17px;
  }
  .teacher-stats-head p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  .teacher-stats-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .teacher-stats-toggle {
    display: inline-grid;
    grid-auto-flow: column;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
  }
  .teacher-stats-toggle button {
    min-height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
  }
  .teacher-stats-toggle button.active {
    background: var(--accent);
    color: #07111f;
  }
  .teacher-stats-controls input,
  .teacher-stats-controls > button {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 800;
  }
  .teacher-stats-controls > button {
    background: var(--accent);
    border-color: var(--accent);
    color: #07111f;
    cursor: pointer;
  }
  .teacher-stats-meta {
    padding: 10px 12px 0;
    color: var(--muted);
    font-size: 12px;
  }
  .teacher-stats-table-wrap {
    width: 100%;
    overflow-x: auto;
    padding: 12px;
  }
  .teacher-stats-table {
    width: 100%;
    min-width: 640px;
    border-collapse: collapse;
    font-size: 13px;
  }
  .teacher-stats-table th,
  .teacher-stats-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  .teacher-stats-table th {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .teacher-stats-table td.num,
  .teacher-stats-table th.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .teacher-stats-table tbody tr:last-child td { border-bottom: 0; }
  .teacher-stats-name {
    display: grid;
    gap: 2px;
  }
  .teacher-stats-name strong { font-size: 14px; }
  .teacher-stats-name span {
    color: var(--muted);
    font-size: 11px;
  }
  .teacher-stats-empty {
    padding: 18px 12px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  .attendance-wrapper {
    display: grid;
    gap: 12px;
    padding: 0 20px 24px;
  }
  .attendance-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .attendance-filter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .attendance-filter-grid select,
  .attendance-filter-grid input {
    min-width: 132px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
  }
  .attendance-filter-grid input[type="search"] {
    min-width: 190px;
  }
  .attendance-quick-tools {
    position: sticky;
    top: 61px;
    z-index: 18;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(30, 41, 59, 0.96);
    padding: 8px;
    backdrop-filter: blur(10px);
  }
  .attendance-quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .attendance-quick-actions button {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 11px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
  }
  .attendance-quick-actions select {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 800;
  }
  .attendance-quick-actions button.active {
    border-color: var(--status-warning);
    background: var(--status-warning);
    color: #111827;
  }
  .attendance-unfinished-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .students-meta,
  .attendance-list-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .attendance-layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }
  .attendance-scope {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
  }
  .attendance-scope h3 {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .attendance-scope dl {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr);
    gap: 8px 10px;
    margin: 0;
    font-size: 13px;
  }
  .attendance-scope dt { color: var(--muted); }
  .attendance-scope dd {
    margin: 0;
    overflow-wrap: anywhere;
  }
  .attendance-flow-list {
    display: grid;
    gap: 8px;
  }
  .attendance-flow-row {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 44px;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .attendance-flow-row span:first-child {
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attendance-flow-track {
    height: 8px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.58);
    overflow: hidden;
  }
  .attendance-flow-fill {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
  }
  .attendance-flow-row b {
    color: var(--text);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .attendance-alert-list {
    display: grid;
    gap: 6px;
    margin-top: 10px;
  }
  .attendance-alert-item {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid rgba(251, 191, 36, 0.24);
    border-radius: 7px;
    background: rgba(251, 191, 36, 0.08);
    padding: 7px 8px;
    font-size: 12px;
  }
  .attendance-alert-item strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attendance-alert-item span {
    color: var(--status-warning);
    font-weight: 900;
    white-space: nowrap;
  }
  .attendance-list {
    display: block;
    min-width: 0;
  }
  .attendance-list-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 12px;
    margin-bottom: 8px;
  }
  .attendance-list-head h3 {
    margin: 0;
    font-size: 15px;
  }
  .attendance-current-range {
    margin-top: 5px;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    background: #e0f2fe;
    color: #075985;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.3;
  }
  .attendance-current-range.no-match {
    border-color: #fecaca;
    background: #fef2f2;
    color: #b91c1c;
  }
  .attendance-board-wrap {
    max-height: 72vh;
    max-height: 72dvh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .attendance-board {
    width: 100%;
    min-width: 1040px;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    table-layout: fixed;
  }
  .attendance-board th,
  .attendance-board td {
    height: 56px;
    padding: 6px 9px;
    border-bottom: 1px solid rgba(51, 65, 85, 0.76);
    text-align: left;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
  }
  .attendance-board thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .attendance-board th:first-child,
  .attendance-board td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    width: 190px;
    min-width: 190px;
    max-width: 190px;
    background: #1b273a;
    box-shadow: 1px 0 0 rgba(51, 65, 85, 0.86);
  }
  .attendance-board thead th:first-child {
    z-index: 3;
    background: var(--panel-2);
  }
  .attendance-board tbody tr.marked td:first-child {
    box-shadow: inset 3px 0 0 var(--accent), 1px 0 0 rgba(51, 65, 85, 0.86);
  }
  .attendance-board tbody tr.unfinished td:first-child {
    box-shadow: inset 3px 0 0 var(--status-warning), 1px 0 0 rgba(51, 65, 85, 0.86);
  }
  .attendance-board tbody tr:hover td {
    background: rgba(39, 52, 73, 0.86);
  }
  .attendance-board tbody tr:hover td:first-child {
    background: #223149;
  }
  .attendance-student-cell {
    display: grid;
    gap: 2px;
    min-width: 176px;
    max-width: 176px;
    max-height: 44px;
    overflow: hidden;
  }
  .attendance-student-name {
    display: block;
    max-width: 170px;
    overflow: hidden;
    color: var(--text);
    font-weight: 900;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attendance-student-cell span {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attendance-year-row th,
  .attendance-year-row td {
    height: 48px;
    background: var(--panel-3);
    color: var(--text);
    border-bottom-color: rgba(56, 189, 248, 0.28);
    font-size: 12px;
    font-weight: 900;
  }
  .attendance-year-row th { color: var(--accent); }
  .attendance-board .attendance-year-row th:first-child {
    background: var(--panel-3);
  }
  .attendance-year-row td { color: var(--muted); }
  .attendance-year-row strong { color: var(--text); }
  .attendance-grade-row th,
  .attendance-grade-row td {
    height: 54px;
    background: #0f172a;
    color: var(--text);
    border-bottom-color: rgba(148, 163, 184, 0.32);
    cursor: pointer;
    font-size: 13px;
    font-weight: 900;
  }
  .attendance-board .attendance-grade-row th:first-child {
    background: #0f172a;
    z-index: 4;
  }
  .attendance-grade-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    border: 0;
    background: transparent;
    color: inherit;
    padding: 0;
    font: inherit;
    cursor: pointer;
  }
  .attendance-grade-caret {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 16px;
    line-height: 1;
  }
  .attendance-grade-row.is-collapsed th,
  .attendance-grade-row.is-collapsed td {
    background: #111827;
  }
  .attendance-status-pill,
  .attendance-note-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    max-width: 92px;
    min-height: 30px;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.42);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
  }
  .attendance-status-pill.good {
    background: rgba(52, 211, 153, 0.18);
    border-color: rgba(52, 211, 153, 0.38);
    color: var(--good);
  }
  .attendance-status-pill.warn {
    background: rgba(251, 191, 36, 0.18);
    border-color: rgba(251, 191, 36, 0.38);
    color: var(--status-warning);
  }
  .attendance-status-pill.bad {
    background: rgba(248, 113, 113, 0.18);
    border-color: rgba(248, 113, 113, 0.4);
    color: var(--bad);
  }
  .attendance-status-pill.koko {
    background: rgba(167, 139, 250, 0.18);
    border-color: rgba(167, 139, 250, 0.4);
    color: var(--koko);
  }
  .attendance-status-pill.home {
    background: rgba(34, 197, 94, 0.18);
    border-color: rgba(34, 197, 94, 0.4);
    color: var(--home);
  }
  .attendance-status-pill.idle {
    background: rgba(100, 116, 139, 0.16);
    color: #cbd5e1;
  }
  .attendance-status-pill.disabled,
  .attendance-status-pill:disabled {
    opacity: 0.48;
    cursor: not-allowed;
    color: var(--muted);
    background: rgba(15, 23, 42, 0.28);
    border-color: rgba(100, 116, 139, 0.18);
  }
  .attendance-status-pill:hover,
  .attendance-note-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .attendance-status-pill.disabled:hover,
  .attendance-status-pill:disabled:hover {
    border-color: rgba(100, 116, 139, 0.18);
    color: var(--muted);
  }
  .attendance-note-btn.has-note {
    border-color: rgba(56, 189, 248, 0.42);
    color: var(--accent);
    background: rgba(56, 189, 248, 0.12);
  }
  .attendance-empty,
  .error-state {
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: 28px 16px;
    text-align: center;
  }
  .error-state { color: #fca5a5; }

  .attendance-choice-backdrop {
    position: fixed;
    inset: 0;
    z-index: 120;
    background: transparent;
  }
  .attendance-choice-menu {
    position: fixed;
    z-index: 121;
    width: 206px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    box-shadow: 0 16px 42px rgba(0,0,0,0.46);
    padding: 8px;
  }
  .attendance-choice-title {
    color: var(--muted);
    font-size: 12px;
    padding: 3px 4px 8px;
  }
  .attendance-choice-menu button {
    width: 100%;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    padding: 8px 9px;
    text-align: left;
    font-weight: 800;
    cursor: pointer;
  }
  .attendance-choice-menu button:hover,
  .attendance-choice-menu button.active {
    background: var(--panel-2);
    color: var(--accent);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;

<script>
  if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const host = window.location.hostname;
        const isAttendanceVercelHost = host.endsWith('.vercel.app') && host.includes('attendance');
        const canUseAttendanceWorker = host.startsWith('attendance.') ||
          isAttendanceVercelHost ||
          host === 'localhost' ||
          host === '127.0.0.1';
      if (canUseAttendanceWorker) {
        navigator.serviceWorker.register('attendance-sw.js').catch(() => {});
      }
    });
  }
</script>
