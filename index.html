<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>DAYCARE PWA</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;

    --status-normal: #16a34a;
    --status-warning: #f59e0b;
    --status-overloaded: #dc2626;
    --status-crisis: #7f1d1d;
    --status-no-student: #64748b;

    --role-daycare: #38bdf8;
    --role-teaching: #a78bfa;
    --role-assistant: #fbbf24;
    --role-assistantTeacher: #34d399;

    --label-col-w: 160px;
    --minute-w: 1.4px;
    --hour-w: calc(var(--minute-w) * 60);
    --row-h: 56px;
    --axis-h: 32px;
    --axis-start: 420;
    --axis-end: 1320;
    --axis-span: 900;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header.top {
    padding: 16px 20px 8px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { margin: 0; font-size: 20px; }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header.top .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .tabs button {
    background: transparent;
    color: var(--muted);
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
  }
  .tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(56,189,248,0.06);
  }
  .tabs button:hover:not(.active) { color: var(--text); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .filters label {
    display: flex;
    flex-direction: column;
    font-size: 11px;
    color: var(--muted);
    gap: 4px;
  }
  .filters select,
  .filters input[type="number"],
  .filters input[type="search"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    min-width: 110px;
  }
  .filters input[type="number"] { width: 90px; min-width: 0; }
  .filters input[type="search"] { min-width: 160px; }
  .filters .spacer { flex: 1; }
  .filters button {
    background: var(--accent);
    color: #0b1220;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .filters button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .filters button.danger {
    background: var(--status-overloaded);
    color: #fff;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    padding: 12px 20px;
  }
  .summary .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .summary .card.clickable {
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.12s ease, background 0.12s ease;
  }
  .summary .card.clickable:hover {
    border-color: var(--accent);
    background: var(--panel-2);
    transform: translateY(-1px);
  }
  .summary .card.active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(56,189,248,0.35);
  }
  .summary .card .label { font-size: 11px; color: var(--muted); }
  .summary .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .summary .card .value.small {
    font-size: 15px;
    line-height: 1.35;
  }
  .summary-rank {
    display: grid;
    gap: 5px;
    margin-top: 8px;
  }
  .summary-rank-row {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto;
    gap: 6px;
    align-items: center;
    color: var(--text);
    font-size: 12px;
  }
  .summary-rank-row .rank-no {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .summary-rank-row .rank-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 800;
  }
  .summary-rank-row .rank-value {
    color: var(--accent);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .summary-rank-row button.rank-name {
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 0;
    text-align: left;
    cursor: pointer;
  }
  .summary-rank-row button.rank-name:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  .summary .card.crisis .value { color: var(--status-crisis); }
  .summary .card.overloaded .value { color: var(--status-overloaded); }
  .summary .card.warning .value { color: var(--status-warning); }
  .summary .card.no-student .value { color: var(--status-no-student); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 0 20px 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .teacher-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 12px;
  }
  .teacher-subtabs {
    display: inline-flex;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  .teacher-subtabs button {
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .teacher-subtabs button.active {
    background: var(--accent);
    color: #0b1220;
  }
  .filter-context {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .filter-context b {
    color: var(--text);
    font-weight: 700;
  }

  .gantt-wrapper {
    padding: 0 12px 24px;
  }
  .gantt {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    grid-template-columns: var(--label-col-w) 1fr;
  }

  .gantt-labels {
    border-right: 1px solid var(--border);
    background: var(--panel-2);
    overflow: hidden;
  }
  .gantt-labels .axis-spacer { height: var(--axis-h); border-bottom: 1px solid var(--border); }
  .gantt-labels .day-header {
    height: 28px;
    line-height: 28px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(56,189,248,0.08);
    border-bottom: 1px solid var(--border);
  }
  .gantt-labels .row-label {
    height: var(--row-h);
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
  }
  .gantt-labels .row-label.pressure-label {
    height: 38px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    background: rgba(15, 23, 42, 0.28);
  }

  .gantt-timeline-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .gantt-timeline {
    width: calc(var(--axis-span) * var(--minute-w));
    min-width: 100%;
  }

  .axis {
    height: var(--axis-h);
    position: relative;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .axis .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--border);
    padding: 6px 4px 0;
    font-size: 11px;
    color: var(--muted);
  }

  .day-divider {
    height: 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(56,189,248,0.04);
  }

  .row {
    position: relative;
    height: var(--row-h);
    border-bottom: 1px solid var(--border);
    background-image: linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: var(--hour-w) 100%;
  }
  .row.pressure-row {
    height: 38px;
    background-color: rgba(15, 23, 42, 0.18);
  }

  .pressure-segment {
    position: absolute;
    top: 6px;
    height: 26px;
    border-radius: 4px;
    padding: 3px 6px;
    color: #fff;
    font-size: 11px;
    line-height: 1;
    overflow: hidden;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pressure-segment span {
    font-weight: 800;
    flex: 0 0 auto;
  }
  .pressure-segment small {
    font-size: 10px;
    opacity: 0.9;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pressure-segment.normal      { background: rgba(22, 163, 74, 0.88); }
  .pressure-segment.warning     { background: rgba(245, 158, 11, 0.92); color: #1a1a1a; }
  .pressure-segment.overloaded  { background: rgba(220, 38, 38, 0.92); }
  .pressure-segment.crisis      { background: rgba(127, 29, 29, 0.96); }
  .pressure-segment.no-student  { background: rgba(100, 116, 139, 0.9); }

  .bar {
    position: absolute;
    top: 4px;
    bottom: 4px;
    border-radius: 4px;
    padding: 4px 6px;
    color: #fff;
    font-size: 11px;
    line-height: 1.25;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: transform 0.08s ease;
  }
  .bar:hover { transform: translateY(-1px); }
  .bar .b1 { font-weight: 700; }
  .bar .b2 { opacity: 0.95; }
  .bar .b3 { opacity: 0.9; font-size: 10px; }

  .bar.normal      { background: var(--status-normal); }
  .bar.warning     { background: var(--status-warning); color: #1a1a1a; }
  .bar.warning .bar-text { color: #1a1a1a; }
  .bar.overloaded  { background: var(--status-overloaded); }
  .bar.crisis      { background: var(--status-crisis); }
  .bar.no-student  { background: var(--status-no-student); }

  .empty-state, .error-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .error-state { color: #fca5a5; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal.wide { max-width: 760px; }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal dl { display: grid; grid-template-columns: 110px 1fr; row-gap: 8px; column-gap: 12px; margin: 0; }
  .modal dt { color: var(--muted); font-size: 13px; }
  .modal dd { margin: 0; font-size: 13px; word-break: break-word; }
  .modal .status-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .modal .status-pill.warning { color: #1a1a1a; }
  .modal .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
  .modal .actions.split { justify-content: space-between; gap: 8px; }
  .modal .actions .right { display: flex; gap: 8px; }
  .modal .actions button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .modal .actions button.primary {
    background: var(--accent);
    color: #0b1220;
    border-color: var(--accent);
    font-weight: 700;
  }
  .modal .actions button.danger {
    background: var(--status-overloaded);
    color: #fff;
    border-color: var(--status-overloaded);
  }
  .modal .actions button:disabled { opacity: 0.6; cursor: wait; }
  .role-modal-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 12px 0 14px;
  }
  .role-modal-metric {
    background: rgba(15,23,42,0.42);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .role-modal-metric span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 4px;
  }
  .role-modal-metric b {
    font-size: 18px;
  }
  .role-modal-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .role-modal-list {
    background: rgba(15,23,42,0.24);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .role-modal-list h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .role-modal-person {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    border-bottom: 1px solid rgba(51,65,85,0.7);
    padding: 7px 0;
  }
  .role-modal-person:last-child { border-bottom: 0; }
  .role-modal-list .hours {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .role-modal-person .main {
    min-width: 0;
  }
  .role-modal-person .name {
    display: block;
    color: var(--text);
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .role-modal-person .tools {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }
  .role-modal-person button {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(15,23,42,0.42);
    color: var(--text);
    padding: 5px 8px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .role-modal-person button.primary {
    border-color: var(--accent);
    color: var(--accent);
  }
  .role-modal-person button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .edit-form {
    display: grid;
    gap: 12px;
  }
  .edit-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .edit-form label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: var(--muted);
    font-size: 12px;
  }
  .edit-form input,
  .edit-form select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 9px;
    font-size: 13px;
    width: 100%;
  }
  .edit-form select {
    appearance: auto;
    -webkit-appearance: menulist;
    padding-right: 34px;
  }
  .tag-field {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    background: rgba(15,23,42,0.28);
  }
  .tag-field-title {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 25px;
    margin-bottom: 7px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 7px;
    font-size: 12px;
  }
  .tag button {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    font-size: 14px;
    line-height: 1;
  }
  .tag-input-row {
    display: flex;
    gap: 6px;
    position: relative;
  }
  .tag-input-row input { flex: 1; }
  .tag-input-row button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    cursor: pointer;
  }
  .suggest-menu {
    position: absolute;
    left: 0;
    right: 64px;
    top: calc(100% + 4px);
    max-height: 220px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    z-index: 150;
    display: none;
  }
  .suggest-menu.open { display: block; }
  .suggest-item {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 8px 10px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(51,65,85,0.7);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
  }
  .suggest-item:last-child { border-bottom: 0; }
  .suggest-item:hover,
  .suggest-item.active {
    background: var(--panel-2);
  }
  .suggest-item .role {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .form-error {
    color: #fca5a5;
    font-size: 12px;
    min-height: 16px;
  }
  .teacher-link {
    cursor: pointer;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .teacher-link:hover { color: #7dd3fc; }

  /* ========== Teachers View ========== */
  .teachers-wrapper { padding: 0 20px 24px; }

  .teachers-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .panel-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel-card h3 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .teachers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .teachers-table th, .teachers-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .teachers-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    background: var(--panel-2);
    position: sticky;
    top: 0;
  }
  .teachers-table th.sorted { color: var(--accent); }
  .teachers-table th .arrow { margin-left: 4px; opacity: 0.7; }
  .teachers-table tbody tr { cursor: pointer; }
  .teachers-table tbody tr:hover { background: var(--panel-2); }
  .teachers-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .teachers-table td.bar-cell { width: 200px; }
  .teachers-table-wrap {
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }
  .students-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 12px;
  }
  .students-search {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .students-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .students-search input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    min-width: 260px;
  }
  .students-filters select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    min-width: 128px;
  }
  .students-meta {
    color: var(--muted);
    font-size: 12px;
  }
  .students-table-wrap {
    overflow: auto;
    max-height: 72vh;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .students-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .students-table th,
  .students-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    text-align: left;
  }
  .students-table th {
    position: sticky;
    top: 0;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .students-table tbody tr:hover { background: var(--panel-2); }
  .students-table td.num {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .student-name {
    color: var(--text);
    font-size: 14px;
  }
  .student-day-badges {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .student-day-badges span {
    display: inline-flex;
    width: 24px;
    height: 24px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.16);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
  }
  .student-day-badges em {
    color: var(--muted);
    font-style: normal;
  }
  .student-month-badges {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    min-width: 120px;
  }
  .student-month-badges span {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 7px;
    background: rgba(148, 163, 184, 0.14);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .student-month-badges span.active {
    background: rgba(52, 211, 153, 0.16);
    color: var(--role-assistantTeacher);
  }
  .student-month-badges span.stop {
    background: rgba(248, 113, 113, 0.16);
    color: #fca5a5;
  }
  .student-month-badges span.archived {
    background: rgba(148, 163, 184, 0.12);
    color: #94a3b8;
  }
  .student-month-badges em {
    color: var(--muted);
    font-style: normal;
  }
  .student-status {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
  }
  .student-status.active {
    background: rgba(52, 211, 153, 0.16);
    color: var(--role-assistantTeacher);
  }
  .student-status.stopped {
    background: rgba(148, 163, 184, 0.16);
    color: var(--muted);
  }
  .student-note {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .student-teacher-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
  }
  .student-teacher-card {
    display: block;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  .student-teacher-card:hover {
    border-color: var(--accent);
  }
  .student-teacher-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .student-teacher-head strong {
    font-size: 16px;
  }
  .student-teacher-head span {
    color: var(--accent);
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .student-teacher-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .student-teacher-metrics span {
    border-radius: 6px;
    background: rgba(15, 23, 42, 0.42);
    padding: 6px 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .student-teacher-metrics b {
    display: block;
    color: var(--text);
    font-size: 16px;
    margin-top: 2px;
  }
  .student-teacher-card dl {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 6px 8px;
    margin: 0;
    font-size: 12px;
  }
  .student-teacher-card dt {
    color: var(--muted);
  }
  .student-teacher-card dd {
    margin: 0;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .student-trend-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .student-trend-wrap:last-child {
    margin-bottom: 0;
  }
  .student-trend-title {
    margin: 14px 0 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 800;
  }
  .student-trend-title:first-child {
    margin-top: 0;
  }
  .student-trend-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 620px;
    font-size: 13px;
  }
  .student-trend-table th,
  .student-trend-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .student-trend-table th:first-child,
  .student-trend-table td:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    background: var(--panel-2);
    z-index: 1;
  }
  .student-trend-table thead th {
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .student-trend-table tbody tr:last-child th,
  .student-trend-table tbody tr:last-child td {
    border-bottom: 0;
  }
  .student-trend-table strong {
    color: var(--text);
  }
  .student-trend-table .trend-total-row th,
  .student-trend-table .trend-total-row td {
    background: rgba(56, 189, 248, 0.08);
  }
  .student-trend-table .trend-total-row th {
    color: var(--accent);
  }
  .trend-link {
    border: 0;
    background: transparent;
    color: var(--accent);
    padding: 0;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  .trend-link:hover {
    text-decoration: underline;
  }
  .teacher-trend td strong {
    display: block;
  }
  .trend-delta {
    display: inline-block;
    margin-top: 2px;
    border-radius: 999px;
    padding: 2px 7px;
    background: rgba(148, 163, 184, 0.14);
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }
  .trend-delta.up {
    background: rgba(52, 211, 153, 0.16);
    color: var(--role-assistantTeacher);
  }
  .trend-delta.down {
    background: rgba(248, 113, 113, 0.16);
    color: #fca5a5;
  }
  .trend-move {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 800;
  }
  .trend-move.gained {
    background: rgba(52, 211, 153, 0.16);
    color: var(--role-assistantTeacher);
  }
  .trend-move.lost {
    background: rgba(248, 113, 113, 0.16);
    color: #fca5a5;
  }
  .trend-stop-link {
    border: 0;
    border-radius: 999px;
    padding: 1px 7px;
    background: rgba(248, 113, 113, 0.18);
    color: #fca5a5;
    font: inherit;
    font-weight: 900;
    cursor: pointer;
  }
  .trend-stop-link:hover {
    filter: brightness(1.15);
    text-decoration: underline;
  }
  .trend-move-line {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .student-analysis-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .modal-student-list {
    max-height: 300px;
  }

  .role-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #0b1220;
  }
  .role-pill.daycare           { background: var(--role-daycare); }
  .role-pill.teaching          { background: var(--role-teaching); }
  .role-pill.assistant         { background: var(--role-assistant); }
  .role-pill.assistantTeacher  { background: var(--role-assistantTeacher); }

  .role-workload-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 10px;
  }
  .role-workload-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    padding: 12px;
    text-align: left;
    color: var(--text);
    font: inherit;
    width: 100%;
  }
  .role-workload-card[data-role-card] { cursor: pointer; }
  .role-workload-card:hover,
  .role-workload-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(56,189,248,0.18);
  }
  .role-workload-card .role-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .role-workload-card .role-title strong {
    font-size: 14px;
  }
  .role-workload-card .role-total {
    color: var(--muted);
    font-size: 12px;
  }
  .role-metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    font-size: 12px;
  }
  .role-metrics .metric {
    background: rgba(15,23,42,0.38);
    border-radius: 6px;
    padding: 7px;
  }
  .role-metrics .metric span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .role-metrics .metric b {
    font-size: 15px;
  }
  .unassigned-list {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .unassigned-list summary {
    cursor: pointer;
    color: var(--text);
    font-weight: 700;
  }
  .unassigned-list div { margin-top: 6px; }
  .unassigned-list button {
    border: 0;
    background: transparent;
    color: var(--accent);
    padding: 0;
    margin: 0 5px 0 0;
    cursor: pointer;
    font: inherit;
  }
  .unassigned-collapsed {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
    margin-top: 10px;
  }
  .role-card-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .role-card-actions button {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(15,23,42,0.42);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .role-card-actions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .teacher-panel[hidden] { display: none; }
  .teachers-table tbody tr.zero-hours {
    color: var(--muted);
  }

  .hbar {
    background: var(--panel-2);
    border-radius: 4px;
    height: 14px;
    position: relative;
    overflow: hidden;
  }
  .hbar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }

  /* Heatmap */
  .heatmap {
    display: grid;
    grid-template-columns: 140px repeat(7, 1fr) 80px;
    gap: 2px;
    font-size: 12px;
    overflow-x: auto;
  }
  .heatmap .cell {
    padding: 6px 8px;
    text-align: center;
    background: var(--panel-2);
    border-radius: 4px;
    min-height: 28px;
    line-height: 1.2;
  }
  .heatmap .cell.name {
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .heatmap .cell.name:hover { color: var(--accent); }
  .heatmap .cell.head {
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .heatmap .cell.total { font-weight: 700; }

  .weekly-schedule-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .weekly-schedule {
    min-width: 980px;
    display: grid;
    grid-template-columns: 140px repeat(7, minmax(120px, 1fr));
    background: var(--border);
    gap: 1px;
    font-size: 12px;
  }
  .weekly-cell {
    background: var(--panel);
    min-height: 76px;
    padding: 8px;
  }
  .weekly-head {
    min-height: 38px;
    background: var(--panel-2);
    color: var(--text);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weekly-teacher {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    text-align: center;
    cursor: pointer;
  }
  .weekly-teacher .name {
    color: var(--accent);
    font-weight: 800;
    font-size: 13px;
  }
  .weekly-teacher .hours {
    color: var(--muted);
    font-size: 11px;
  }
  .weekly-slot {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 6px;
    padding: 6px 7px;
    margin-bottom: 5px;
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .weekly-slot:last-child { margin-bottom: 0; }
  .weekly-slot:hover { filter: brightness(1.12); }
  .weekly-slot .time {
    display: block;
    font-weight: 600;
    opacity: 0.96;
  }
  .weekly-day-total {
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid rgba(148,163,184,0.24);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-align: right;
  }
  .weekly-slot.block-hm { background: #7c3aed; }
  .weekly-slot.block-pu { background: #3b82f6; }
  .weekly-slot.block-subang { background: #f97316; }
  .weekly-slot.block-other { background: #64748b; }

  /* Mini gantt for teacher detail */
  .mini-gantt {
    width: 100%;
    margin-top: 12px;
  }
  .mini-gantt .row-mini {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
  }
  .mini-gantt .row-mini .day-name {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  .mini-gantt .track {
    position: relative;
    height: 22px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-gantt .seg {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 3px;
    color: #0b1220;
    font-size: 10px;
    line-height: 22px;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
  }

  .view-section { display: block; }
  .view-section[hidden] { display: none; }

  @media (max-width: 720px) {
    .edit-grid { grid-template-columns: 1fr; }
    .role-modal-grid,
    .role-modal-columns,
    .student-analysis-grid { grid-template-columns: 1fr; }
    .teachers-table th, .teachers-table td { padding: 6px 6px; font-size: 12px; }
    .teachers-table td.bar-cell { width: 120px; }
    .role-workload-grid { grid-template-columns: 1fr; }
    .students-search,
    .students-search input { width: 100%; min-width: 0; }
    .students-filters,
    .students-filters select { width: 100%; min-width: 0; }
    .heatmap { grid-template-columns: 100px repeat(7, 1fr) 60px; font-size: 11px; }
    .heatmap .cell { padding: 4px 4px; }
    .weekly-schedule { grid-template-columns: 110px repeat(7, minmax(110px, 1fr)); font-size: 11px; }
    .weekly-cell { padding: 6px; }
  }

  @media (max-width: 640px) {
    :root {
      --label-col-w: 110px;
      --row-h: 60px;
      --minute-w: 1.6px;
    }
    header.top { padding: 12px 14px 6px; }
    .tabs { padding: 6px 14px 0; }
    .tabs button { padding: 8px 10px; font-size: 12px; }
    .filters { padding: 10px 14px; }
    .summary { padding: 10px 14px; }
    .legend { padding: 0 14px 8px; }
    .gantt-wrapper { padding: 0 8px 20px; }
    .teachers-wrapper { padding: 0 12px 20px; }
    .filters select, .filters input[type="number"] { font-size: 12px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>DAYCARE PWA</h1>
  <p>查看每个时段的学生人数、老师安排与人手比例</p>
  <div class="meta" id="meta">加载中…</div>
</header>

<nav class="tabs" role="tablist">
  <button data-view="gantt" class="active" type="button">周排班 Gantt</button>
  <button data-view="teachers" type="button">老师工作量</button>
  <button data-view="students" type="button">学生名单</button>
  <button data-view="stops" type="button">停步名单</button>
</nav>

<section class="filters">
  <label data-view-only="gantt teachers">星期
    <select id="filter-day"><option value="">全部</option></select>
  </label>
  <label data-view-only="gantt teachers">BLOCK
    <select id="filter-block"><option value="">全部</option></select>
  </label>
  <label data-view-only="gantt teachers">角色
    <select id="filter-role">
      <option value="">全部</option>
      <option value="daycare">DAYCARE老师</option>
      <option value="teaching">教书老师</option>
      <option value="assistant">助理</option>
      <option value="assistantTeacher">助教</option>
    </select>
  </label>
  <label data-view-only="gantt teachers">老师
    <select id="filter-teacher"><option value="">全部</option></select>
  </label>
  <label data-view-only="gantt">状态
    <select id="filter-status">
      <option value="">全部</option>
      <option value="normal">正常</option>
      <option value="warning">警戒</option>
      <option value="overloaded">超标</option>
      <option value="crisis">危机</option>
      <option value="no-student">无学生</option>
    </select>
  </label>
  <label data-view-only="gantt">老师警戒线
    <input type="number" id="threshold-teacher" value="30" min="1" step="1" />
  </label>
  <label data-view-only="gantt">人手警戒线
    <input type="number" id="threshold-manpower" value="15" min="1" step="1" />
  </label>
  <span class="spacer"></span>
  <button id="add-slot" type="button" data-view-only="gantt">新增时段</button>
  <button id="add-staff" type="button" data-view-only="teachers">新增人手</button>
  <button id="reset" class="secondary" type="button" data-view-only="gantt teachers">重置筛选</button>
  <button id="refresh" type="button">刷新</button>
</section>

<!-- ========== Gantt View ========== -->
<div id="view-gantt" class="view-section">
  <section class="summary" id="summary"></section>

  <div class="legend">
    <span><span class="dot" style="background: var(--status-normal)"></span>正常</span>
    <span><span class="dot" style="background: var(--status-warning)"></span>警戒</span>
    <span><span class="dot" style="background: var(--status-overloaded)"></span>超标</span>
    <span><span class="dot" style="background: var(--status-crisis)"></span>危机</span>
    <span><span class="dot" style="background: var(--status-no-student)"></span>无学生</span>
  </div>

  <section class="gantt-wrapper">
    <div id="gantt-root">
      <div class="empty-state">加载数据中…</div>
    </div>
  </section>
</div>

<!-- ========== Teachers View ========== -->
<div id="view-teachers" class="view-section" hidden>
  <section class="summary" id="teachers-summary"></section>

  <div class="legend">
    <span><span class="dot" style="background: var(--role-daycare)"></span>DAYCARE老师</span>
    <span><span class="dot" style="background: var(--role-teaching)"></span>教书老师</span>
    <span><span class="dot" style="background: var(--role-assistant)"></span>助理</span>
    <span><span class="dot" style="background: var(--role-assistantTeacher)"></span>助教</span>
  </div>

  <div class="teacher-toolbar">
    <div class="teacher-subtabs" id="teacher-subtabs" role="tablist">
      <button type="button" data-teacher-view="overview" class="active">总览</button>
      <button type="button" data-teacher-view="ranking">排行</button>
      <button type="button" data-teacher-view="schedule">时间表</button>
    </div>
    <div class="filter-context" id="teacher-filter-context"></div>
  </div>

  <section class="teachers-wrapper">
    <div class="teachers-grid">
      <div class="panel-card teacher-panel" data-teacher-panel="overview">
        <h3>四个角色工作量概览</h3>
        <div id="role-workload"></div>
      </div>

      <div class="panel-card teacher-panel" data-teacher-panel="ranking" hidden>
        <h3>老师排行（点击表头排序，点行看详情）</h3>
        <div class="teachers-table-wrap">
          <table class="teachers-table" id="teachers-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="panel-card teacher-panel" data-teacher-panel="ranking" hidden>
        <h3>热力图：老师 × 星期（颜色越深 = 工时越多）</h3>
        <div id="teachers-heatmap"></div>
      </div>

      <div class="panel-card teacher-panel" data-teacher-panel="schedule" hidden>
        <h3>老师工作时间表</h3>
        <div class="weekly-schedule-wrap">
          <div id="teachers-weekly-schedule"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ========== Students View ========== -->
<div id="view-students" class="view-section" hidden>
  <section class="summary" id="students-summary"></section>
  <section class="teachers-wrapper">
    <div class="panel-card">
      <h3>每月人数变化</h3>
      <div id="student-monthly-trend"></div>
    </div>

    <div class="panel-card">
      <h3>负责老师总结</h3>
      <div id="student-teacher-summary"></div>
    </div>

    <div class="panel-card">
      <h3>学生名单</h3>
      <div class="students-toolbar">
        <div class="students-search">
          <input id="student-search" type="search" placeholder="搜索学生名单" autocomplete="off" />
        </div>
        <div class="students-filters">
          <select id="student-filter-year" aria-label="筛选年级"></select>
          <select id="student-filter-teacher" aria-label="筛选负责老师"></select>
          <select id="student-filter-time" aria-label="筛选时间段"></select>
          <select id="student-filter-campus" aria-label="筛选分院"></select>
          <select id="student-filter-weekday" aria-label="筛选星期">
            <option value="">全部星期</option>
            <option value="MON">星期一</option>
            <option value="TUE">星期二</option>
            <option value="WED">星期三</option>
            <option value="THUR">星期四</option>
            <option value="FRI">星期五</option>
          </select>
          <select id="student-filter-stop" aria-label="筛选状态">
            <option value="">全部状态</option>
            <option value="active">Active</option>
            <option value="stopped">Stop</option>
          </select>
        </div>
        <div class="students-meta" id="students-meta">尚未加载</div>
      </div>
      <div class="students-table-wrap">
        <table class="students-table" id="students-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<!-- ========== Stop Students View ========== -->
<div id="view-stops" class="view-section" hidden>
  <section class="summary" id="stops-summary"></section>
  <section class="teachers-wrapper">
    <div class="panel-card">
      <h3>停步名单筛选</h3>
      <div class="students-toolbar">
        <div class="students-search">
          <input id="stop-search" type="search" placeholder="搜索停步学生" autocomplete="off" />
        </div>
        <div class="students-filters">
          <select id="stop-filter-month" aria-label="筛选停步月份"></select>
          <select id="stop-filter-teacher" aria-label="筛选负责老师"></select>
          <select id="stop-filter-year" aria-label="筛选年级"></select>
          <select id="stop-filter-campus" aria-label="筛选分院"></select>
          <button id="stop-reset" class="secondary" type="button">重置</button>
        </div>
        <div class="students-meta" id="stops-meta">尚未加载</div>
      </div>
    </div>

    <div class="panel-card">
      <h3>每月停步概览</h3>
      <div id="stops-monthly"></div>
    </div>

    <div class="panel-card">
      <h3>停步学生名单</h3>
      <div class="students-table-wrap">
        <table class="students-table" id="stops-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<div id="modal-root"></div>
