<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>一周人力 Gantt Dashboard</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;

    --status-normal: #16a34a;
    --status-warning: #f59e0b;
    --status-overloaded: #dc2626;
    --status-crisis: #7f1d1d;
    --status-no-student: #64748b;

    --role-daycare: #38bdf8;
    --role-teaching: #a78bfa;
    --role-assistant: #fbbf24;
    --role-assistantTeacher: #34d399;

    --label-col-w: 160px;
    --minute-w: 1.4px;
    --hour-w: calc(var(--minute-w) * 60);
    --row-h: 56px;
    --axis-h: 32px;
    --axis-start: 420;
    --axis-end: 1320;
    --axis-span: 900;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header.top {
    padding: 16px 20px 8px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { margin: 0; font-size: 20px; }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header.top .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .tabs button {
    background: transparent;
    color: var(--muted);
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
  }
  .tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(56,189,248,0.06);
  }
  .tabs button:hover:not(.active) { color: var(--text); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .filters label {
    display: flex;
    flex-direction: column;
    font-size: 11px;
    color: var(--muted);
    gap: 4px;
  }
  .filters select,
  .filters input[type="number"],
  .filters input[type="search"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    min-width: 110px;
  }
  .filters input[type="number"] { width: 90px; min-width: 0; }
  .filters input[type="search"] { min-width: 160px; }
  .filters .spacer { flex: 1; }
  .filters button {
    background: var(--accent);
    color: #0b1220;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .filters button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .filters button.danger {
    background: var(--status-overloaded);
    color: #fff;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    padding: 12px 20px;
  }
  .summary .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .summary .card.clickable {
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.12s ease, background 0.12s ease;
  }
  .summary .card.clickable:hover {
    border-color: var(--accent);
    background: var(--panel-2);
    transform: translateY(-1px);
  }
  .summary .card.active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(56,189,248,0.35);
  }
  .summary .card .label { font-size: 11px; color: var(--muted); }
  .summary .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .summary .card.crisis .value { color: var(--status-crisis); }
  .summary .card.overloaded .value { color: var(--status-overloaded); }
  .summary .card.warning .value { color: var(--status-warning); }
  .summary .card.no-student .value { color: var(--status-no-student); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 0 20px 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .gantt-wrapper {
    padding: 0 12px 24px;
  }
  .gantt {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    grid-template-columns: var(--label-col-w) 1fr;
  }

  .gantt-labels {
    border-right: 1px solid var(--border);
    background: var(--panel-2);
    overflow: hidden;
  }
  .gantt-labels .axis-spacer { height: var(--axis-h); border-bottom: 1px solid var(--border); }
  .gantt-labels .day-header {
    height: 28px;
    line-height: 28px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(56,189,248,0.08);
    border-bottom: 1px solid var(--border);
  }
  .gantt-labels .row-label {
    height: var(--row-h);
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
  }

  .gantt-timeline-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .gantt-timeline {
    width: calc(var(--axis-span) * var(--minute-w));
    min-width: 100%;
  }

  .axis {
    height: var(--axis-h);
    position: relative;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .axis .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--border);
    padding: 6px 4px 0;
    font-size: 11px;
    color: var(--muted);
  }

  .day-divider {
    height: 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(56,189,248,0.04);
  }

  .row {
    position: relative;
    height: var(--row-h);
    border-bottom: 1px solid var(--border);
    background-image: linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: var(--hour-w) 100%;
  }

  .bar {
    position: absolute;
    top: 4px;
    bottom: 4px;
    border-radius: 4px;
    padding: 4px 6px;
    color: #fff;
    font-size: 11px;
    line-height: 1.25;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: transform 0.08s ease;
  }
  .bar:hover { transform: translateY(-1px); }
  .bar .b1 { font-weight: 700; }
  .bar .b2 { opacity: 0.95; }
  .bar .b3 { opacity: 0.9; font-size: 10px; }

  .bar.normal      { background: var(--status-normal); }
  .bar.warning     { background: var(--status-warning); color: #1a1a1a; }
  .bar.warning .bar-text { color: #1a1a1a; }
  .bar.overloaded  { background: var(--status-overloaded); }
  .bar.crisis      { background: var(--status-crisis); }
  .bar.no-student  { background: var(--status-no-student); }

  .empty-state, .error-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .error-state { color: #fca5a5; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal dl { display: grid; grid-template-columns: 110px 1fr; row-gap: 8px; column-gap: 12px; margin: 0; }
  .modal dt { color: var(--muted); font-size: 13px; }
  .modal dd { margin: 0; font-size: 13px; word-break: break-word; }
  .modal .status-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .modal .status-pill.warning { color: #1a1a1a; }
  .modal .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
  .modal .actions.split { justify-content: space-between; gap: 8px; }
  .modal .actions .right { display: flex; gap: 8px; }
  .modal .actions button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .modal .actions button.primary {
    background: var(--accent);
    color: #0b1220;
    border-color: var(--accent);
    font-weight: 700;
  }
  .modal .actions button.danger {
    background: var(--status-overloaded);
    color: #fff;
    border-color: var(--status-overloaded);
  }
  .modal .actions button:disabled { opacity: 0.6; cursor: wait; }
  .edit-form {
    display: grid;
    gap: 12px;
  }
  .edit-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .edit-form label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: var(--muted);
    font-size: 12px;
  }
  .edit-form input,
  .edit-form select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 9px;
    font-size: 13px;
    width: 100%;
  }
  .edit-form select {
    appearance: auto;
    -webkit-appearance: menulist;
    padding-right: 34px;
  }
  .tag-field {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    background: rgba(15,23,42,0.28);
  }
  .tag-field-title {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 25px;
    margin-bottom: 7px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 7px;
    font-size: 12px;
  }
  .tag button {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    font-size: 14px;
    line-height: 1;
  }
  .tag-input-row {
    display: flex;
    gap: 6px;
    position: relative;
  }
  .tag-input-row input { flex: 1; }
  .tag-input-row button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    cursor: pointer;
  }
  .suggest-menu {
    position: absolute;
    left: 0;
    right: 64px;
    top: calc(100% + 4px);
    max-height: 220px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    z-index: 150;
    display: none;
  }
  .suggest-menu.open { display: block; }
  .suggest-item {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 8px 10px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(51,65,85,0.7);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
  }
  .suggest-item:last-child { border-bottom: 0; }
  .suggest-item:hover,
  .suggest-item.active {
    background: var(--panel-2);
  }
  .suggest-item .role {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .form-error {
    color: #fca5a5;
    font-size: 12px;
    min-height: 16px;
  }
  .teacher-link {
    cursor: pointer;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .teacher-link:hover { color: #7dd3fc; }

  /* ========== Teachers View ========== */
  .teachers-wrapper { padding: 0 20px 24px; }

  .teachers-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .panel-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel-card h3 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .teachers-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .teachers-table th, .teachers-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .teachers-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    background: var(--panel-2);
    position: sticky;
    top: 0;
  }
  .teachers-table th.sorted { color: var(--accent); }
  .teachers-table th .arrow { margin-left: 4px; opacity: 0.7; }
  .teachers-table tbody tr { cursor: pointer; }
  .teachers-table tbody tr:hover { background: var(--panel-2); }
  .teachers-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .teachers-table td.bar-cell { width: 200px; }
  .teachers-table-wrap {
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }

  .role-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #0b1220;
  }
  .role-pill.daycare           { background: var(--role-daycare); }
  .role-pill.teaching          { background: var(--role-teaching); }
  .role-pill.assistant         { background: var(--role-assistant); }
  .role-pill.assistantTeacher  { background: var(--role-assistantTeacher); }

  .role-workload-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 10px;
  }
  .role-workload-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    padding: 12px;
  }
  .role-workload-card .role-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .role-workload-card .role-title strong {
    font-size: 14px;
  }
  .role-workload-card .role-total {
    color: var(--muted);
    font-size: 12px;
  }
  .role-metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    font-size: 12px;
  }
  .role-metrics .metric {
    background: rgba(15,23,42,0.38);
    border-radius: 6px;
    padding: 7px;
  }
  .role-metrics .metric span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .role-metrics .metric b {
    font-size: 15px;
  }
  .unassigned-list {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .unassigned-list button {
    border: 0;
    background: transparent;
    color: var(--accent);
    padding: 0;
    margin: 0 5px 0 0;
    cursor: pointer;
    font: inherit;
  }
  .teachers-table tbody tr.zero-hours {
    color: var(--muted);
  }

  .hbar {
    background: var(--panel-2);
    border-radius: 4px;
    height: 14px;
    position: relative;
    overflow: hidden;
  }
  .hbar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }

  /* Heatmap */
  .heatmap {
    display: grid;
    grid-template-columns: 140px repeat(7, 1fr) 80px;
    gap: 2px;
    font-size: 12px;
    overflow-x: auto;
  }
  .heatmap .cell {
    padding: 6px 8px;
    text-align: center;
    background: var(--panel-2);
    border-radius: 4px;
    min-height: 28px;
    line-height: 1.2;
  }
  .heatmap .cell.name {
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .heatmap .cell.name:hover { color: var(--accent); }
  .heatmap .cell.head {
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .heatmap .cell.total { font-weight: 700; }

  .weekly-schedule-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .weekly-schedule {
    min-width: 980px;
    display: grid;
    grid-template-columns: 140px repeat(7, minmax(120px, 1fr));
    background: var(--border);
    gap: 1px;
    font-size: 12px;
  }
  .weekly-cell {
    background: var(--panel);
    min-height: 76px;
    padding: 8px;
  }
  .weekly-head {
    min-height: 38px;
    background: var(--panel-2);
    color: var(--text);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weekly-teacher {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    text-align: center;
    cursor: pointer;
  }
  .weekly-teacher .name {
    color: var(--accent);
    font-weight: 800;
    font-size: 13px;
  }
  .weekly-teacher .hours {
    color: var(--muted);
    font-size: 11px;
  }
  .weekly-slot {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 6px;
    padding: 6px 7px;
    margin-bottom: 5px;
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .weekly-slot:last-child { margin-bottom: 0; }
  .weekly-slot:hover { filter: brightness(1.12); }
  .weekly-slot .time {
    display: block;
    font-weight: 600;
    opacity: 0.96;
  }
  .weekly-day-total {
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid rgba(148,163,184,0.24);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-align: right;
  }
  .weekly-slot.block-hm { background: #7c3aed; }
  .weekly-slot.block-pu { background: #3b82f6; }
  .weekly-slot.block-subang { background: #f97316; }
  .weekly-slot.block-other { background: #64748b; }

  /* Mini gantt for teacher detail */
  .mini-gantt {
    width: 100%;
    margin-top: 12px;
  }
  .mini-gantt .row-mini {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
  }
  .mini-gantt .row-mini .day-name {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  .mini-gantt .track {
    position: relative;
    height: 22px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-gantt .seg {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 3px;
    color: #0b1220;
    font-size: 10px;
    line-height: 22px;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
  }

  .view-section { display: block; }
  .view-section[hidden] { display: none; }

  @media (max-width: 720px) {
    .edit-grid { grid-template-columns: 1fr; }
    .teachers-table th, .teachers-table td { padding: 6px 6px; font-size: 12px; }
    .teachers-table td.bar-cell { width: 120px; }
    .role-workload-grid { grid-template-columns: 1fr; }
    .heatmap { grid-template-columns: 100px repeat(7, 1fr) 60px; font-size: 11px; }
    .heatmap .cell { padding: 4px 4px; }
    .weekly-schedule { grid-template-columns: 110px repeat(7, minmax(110px, 1fr)); font-size: 11px; }
    .weekly-cell { padding: 6px; }
  }

  @media (max-width: 640px) {
    :root {
      --label-col-w: 110px;
      --row-h: 60px;
      --minute-w: 1.6px;
    }
    header.top { padding: 12px 14px 6px; }
    .tabs { padding: 6px 14px 0; }
    .tabs button { padding: 8px 10px; font-size: 12px; }
    .filters { padding: 10px 14px; }
    .summary { padding: 10px 14px; }
    .legend { padding: 0 14px 8px; }
    .gantt-wrapper { padding: 0 8px 20px; }
    .teachers-wrapper { padding: 0 12px 20px; }
    .filters select, .filters input[type="number"] { font-size: 12px; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>一周人力覆盖 Gantt Dashboard</h1>
  <p>查看每个时段的学生人数、老师安排与人手比例</p>
  <div class="meta" id="meta">加载中…</div>
</header>

<nav class="tabs" role="tablist">
  <button data-view="gantt" class="active" type="button">周排班 Gantt</button>
  <button data-view="teachers" type="button">老师工作量</button>
</nav>

<section class="filters">
  <label>星期
    <select id="filter-day"><option value="">全部</option></select>
  </label>
  <label>BLOCK
    <select id="filter-block"><option value="">全部</option></select>
  </label>
  <label>角色
    <select id="filter-role">
      <option value="">全部</option>
      <option value="daycare">DAYCARE老师</option>
      <option value="teaching">教书老师</option>
      <option value="assistant">助理</option>
      <option value="assistantTeacher">助教</option>
    </select>
  </label>
  <label>老师
    <select id="filter-teacher"><option value="">全部</option></select>
  </label>
  <label data-view-only="gantt">状态
    <select id="filter-status">
      <option value="">全部</option>
      <option value="normal">正常</option>
      <option value="warning">警戒</option>
      <option value="overloaded">超标</option>
      <option value="crisis">危机</option>
      <option value="no-student">无学生</option>
    </select>
  </label>
  <label data-view-only="gantt">老师警戒线
    <input type="number" id="threshold-teacher" value="30" min="1" step="1" />
  </label>
  <label data-view-only="gantt">人手警戒线
    <input type="number" id="threshold-manpower" value="15" min="1" step="1" />
  </label>
  <span class="spacer"></span>
  <button id="add-slot" type="button">新增时段</button>
  <button id="reset" class="secondary" type="button">重置筛选</button>
  <button id="refresh" type="button">刷新</button>
</section>

<!-- ========== Gantt View ========== -->
<div id="view-gantt" class="view-section">
  <section class="summary" id="summary"></section>

  <div class="legend">
    <span><span class="dot" style="background: var(--status-normal)"></span>正常</span>
    <span><span class="dot" style="background: var(--status-warning)"></span>警戒</span>
    <span><span class="dot" style="background: var(--status-overloaded)"></span>超标</span>
    <span><span class="dot" style="background: var(--status-crisis)"></span>危机</span>
    <span><span class="dot" style="background: var(--status-no-student)"></span>无学生</span>
  </div>

  <section class="gantt-wrapper">
    <div id="gantt-root">
      <div class="empty-state">加载数据中…</div>
    </div>
  </section>
</div>

<!-- ========== Teachers View ========== -->
<div id="view-teachers" class="view-section" hidden>
  <section class="summary" id="teachers-summary"></section>

  <div class="legend">
    <span><span class="dot" style="background: var(--role-daycare)"></span>DAYCARE老师</span>
    <span><span class="dot" style="background: var(--role-teaching)"></span>教书老师</span>
    <span><span class="dot" style="background: var(--role-assistant)"></span>助理</span>
    <span><span class="dot" style="background: var(--role-assistantTeacher)"></span>助教</span>
  </div>

  <section class="teachers-wrapper">
    <div class="teachers-grid">
      <div class="panel-card">
        <h3>四个角色工作量概览</h3>
        <div id="role-workload"></div>
      </div>

      <div class="panel-card">
        <h3>老师排行（点击表头排序，点行看详情）</h3>
        <div class="teachers-table-wrap">
          <table class="teachers-table" id="teachers-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="panel-card">
        <h3>热力图：老师 × 星期（颜色越深 = 工时越多）</h3>
        <div id="teachers-heatmap"></div>
      </div>

      <div class="panel-card">
        <h3>老师工作时间表</h3>
        <div class="weekly-schedule-wrap">
          <div id="teachers-weekly-schedule"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="modal-root"></div>

<script src="/js/gantt.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
